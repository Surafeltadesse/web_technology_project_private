spring.application.name=event_and_guest_managment_system
# Server Configuration
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/event_and_guest_management?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Admin}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Spring Boot 4.1.0 Jackson Serialization Configuration
spring.jackson.datatype.datetime.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# Custom JWT Configuration
jwt.secret=${JWT_SECRET:eventgate-super-secret-key-change-in-production-min-256-bits!!}
jwt.expiration-ms=86400000

# Custom QR Code Configuration
qr.output-dir=${QR_OUTPUT_DIR:uploads/qr-codes}
qr.base-url=${QR_BASE_URL:http://localhost:8080}

logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
